name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for coverage comparison

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Install from uv.lock. "uv pip install" ignores the lockfile and
        # resolves dependencies fresh on every run, so an upstream release of
        # any transitive dependency can break CI without a code change.
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: |
          uv run --no-sync pytest tests/ \
            --cov=pretix_postfinance \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  test-fork:
    # The plugin has to work on two pretixes: the upstream release the
    # lockfile pins (covered by the "test" job above) and the EFCC fork,
    # which is the only one that has installments. Both are exercised by
    # the same suite — the installment tests skip themselves where pretix
    # cannot provide plans — so without this job the fork side of that
    # code would never run in CI.
    name: test (pretix fork)
    runs-on: ubuntu-latest

    env:
      # Tracks the fork's integration branch on purpose: this job exists to
      # notice when the fork moves in a way the plugin does not follow. That
      # also means an unrelated push to the fork can turn this job red
      # without a change here — pin it to a commit SHA if that gets in the
      # way, and bump the pin deliberately.
      PRETIX_FORK_REF: efcc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Install from uv.lock, see the test job above. This brings in the
        # upstream pretix, which the next step replaces with the fork.
        run: uv sync --extra dev

      - name: Check out the pretix fork
        uses: actions/checkout@v4
        with:
          repository: the-efcc/pretix
          ref: ${{ env.PRETIX_FORK_REF }}
          path: .pretix-fork

      - name: Install the pretix fork
        # Replaces the pretix from the lockfile. The fork is newer than the
        # pinned release, so its own dependency bounds are resolved fresh —
        # that is the point of the job, not an oversight.
        run: uv pip install -e ./.pretix-fork

      - name: Verify the fork is what is installed
        # A missing app would make every installment test skip itself and
        # leave this job green while testing nothing at all.
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: |
          uv run --no-sync python -c "
          import django
          django.setup()
          import pretix
          from django.apps import apps
          from pretix.efcc.models import InstallmentPlan, ScheduledInstallment
          print('pretix', pretix.__version__, 'from', pretix.__file__)
          print('installments app:', apps.get_app_config('efcc').verbose_name)
          "

      - name: Run tests against the fork
        run: |
          set -o pipefail
          uv run --no-sync pytest tests/ -v -rs | tee pytest.log

      - name: Fail if any test skipped itself
        # On the fork nothing has a reason to skip. A skip here means the
        # suite quietly decided pretix has no installments, which is the one
        # failure this job is meant to catch.
        run: |
          if grep -q "SKIPPED" pytest.log; then
            echo "::error::Tests skipped while running against the pretix fork:"
            grep "SKIPPED" pytest.log
            exit 1
          fi

  coverage-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Install from uv.lock, see the test job above.
        run: uv sync --extra dev

      - name: Get coverage for PR branch
        run: |
          uv run --no-sync pytest tests/ \
            --cov=pretix_postfinance \
            --cov-report=json \
            -q
          mv coverage.json pr_coverage.json

      - name: Get coverage for base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          uv sync --extra dev --quiet
          uv run --no-sync pytest tests/ \
            --cov=pretix_postfinance \
            --cov-report=json \
            -q 2>/dev/null || echo '{"totals": {"percent_covered": 0}}' > coverage.json
          mv coverage.json base_coverage.json
          git checkout ${{ github.event.pull_request.head.sha }}

      - name: Compare coverage
        id: coverage-diff
        run: |
          uv run --no-sync python << 'EOF'
          import json
          import os

          def get_coverage(filename):
              try:
                  with open(filename) as f:
                      data = json.load(f)
                      return data.get('totals', {}).get('percent_covered', 0)
              except:
                  return 0

          pr_cov = get_coverage('pr_coverage.json')
          base_cov = get_coverage('base_coverage.json')
          diff = pr_cov - base_cov

          # Format output
          if diff > 0:
              emoji = "📈"
              sign = "+"
          elif diff < 0:
              emoji = "📉"
              sign = ""
          else:
              emoji = "➡️"
              sign = ""

          summary = f"""## Coverage Report {emoji}

          | Metric | Value |
          |--------|-------|
          | Base branch coverage | {base_cov:.2f}% |
          | PR coverage | {pr_cov:.2f}% |
          | Coverage change | {sign}{diff:.2f}% |
          """

          # Write to GitHub step summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)

          # Set output for PR comment
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"base_coverage={base_cov:.2f}\n")
              f.write(f"pr_coverage={pr_cov:.2f}\n")
              f.write(f"coverage_diff={sign}{diff:.2f}\n")
              f.write(f"emoji={emoji}\n")

          # Fail if coverage decreased significantly
          if diff < -5:
              print(f"::warning::Coverage decreased by {abs(diff):.2f}%")
          EOF

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Install from uv.lock so the checked ty version is reproducible;
        # a floating "ty>=..." resolution breaks CI whenever a new ty
        # release adds rules that fire on existing code.
        run: uv sync --extra dev

      - name: Run ty
        run: uv run --no-sync ty check pretix_postfinance/

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Install from uv.lock, see the test job above.
        run: uv sync --extra dev

      - name: Run ruff
        run: uv run --no-sync ruff check .
